<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Light show</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Instrument+Sans:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#0a0810;--panel:#16121f;--line:#2b2440;--text:#f3eefc;--muted:#9d93b8;
--red:#ff1744;--blue:#2979ff;--yellow:#ffea00;--green:#00e676;--purple:#d500f9;
--btn:#f3eefc;--btnText:#0a0810}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:16px/1.5 "Instrument Sans",system-ui,sans-serif}
[hidden]{display:none!important}
button,select,input{font:inherit}
button{border:0;border-radius:999px;padding:.7em 1.3em;background:var(--btn);color:var(--btnText);font-weight:600;cursor:pointer}
button.ghost{background:transparent;color:var(--text);box-shadow:inset 0 0 0 1.5px var(--line)}
button:disabled{opacity:.35;cursor:not-allowed}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
h1{font:800 clamp(1.8rem,4vw,2.8rem)/1 Unbounded,sans-serif;margin:0 0 .3em;letter-spacing:-.02em}
.muted{color:var(--muted)}
.scene{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.light{position:absolute;inset:0;opacity:0;pointer-events:none}

/* coordinator */
#host{max-width:1100px;margin:0 auto;padding:max(24px,env(safe-area-inset-top)) 20px 40px;display:grid;gap:20px;
grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);grid-template-areas:"head head" "ctrl stage" "join stage"}
#host header{grid-area:head}
#ctrl{grid-area:ctrl}#join{grid-area:join}#stage{grid-area:stage}
#host>*{min-width:0}
#fileName{overflow-wrap:anywhere}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px;display:grid;gap:14px;align-content:start}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.split>*{flex:1 1 auto}
label.file{display:block;border:1.5px dashed var(--line);border-radius:14px;padding:16px;text-align:center;cursor:pointer}
label.file:hover{border-color:var(--muted)}
input[type=file]{display:none}
input[type=range]{width:100%;accent-color:var(--purple)}
select{width:100%;background:#0d0a15;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:.6em}
#stage{position:relative;overflow:hidden;border-radius:20px;border:1px solid var(--line);background:#000;min-height:340px;
display:grid;place-items:end start}
#scene{position:relative;margin:0;padding:20px;font:800 clamp(1.6rem,3.5vw,2.6rem)/1.05 Unbounded,sans-serif;mix-blend-mode:difference;color:#fff}
#stageFs{position:absolute;top:14px;right:14px;z-index:2;background:rgba(10,8,16,.75)}
#qr{background:#fff;padding:10px;border-radius:12px;width:max-content;line-height:0}
.linkbox{display:flex;gap:8px}
.linkbox input{flex:1;min-width:0;background:#0d0a15;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:.6em}
.dot{display:inline-block;width:.6em;height:.6em;border-radius:50%;background:var(--muted);margin-right:.4em}
.dot.on{background:var(--green)}
@media(max-width:800px){#host{grid-template-columns:1fr;grid-template-areas:"head" "ctrl" "stage" "join"}#stage{min-height:240px}}

/* guest */
#guest{position:fixed;inset:0;background:#000;overflow:hidden}
#fsBig{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3;padding:1.1em 1.8em;font-size:1.25rem;box-shadow:0 0 0 8px rgba(255,255,255,.12)}
#gline{position:absolute;left:0;right:0;top:calc(50% + 4.2rem);text-align:center;color:var(--muted);font-size:.9rem;z-index:3;padding:0 16px}
#guest.calm #fsBig,#guest.calm #gline{display:none}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
</head>
<body>

<!-- COORDINATOR -->
<main id="host" hidden>
  <header>
    <h1>Light show</h1>
    <p class="muted" id="ver" style="margin:0 0 .4em;font-size:.8rem">Version 14</p>
    <p class="muted" id="hostStatus">Starting…</p>
    <button id="hostFs" class="ghost">Go full screen</button>
  </header>

  <section class="panel" id="ctrl">
    <label class="file" id="fileLabel">
      <input type="file" id="file" accept="audio/*,video/*">
      <strong id="fileName">Choose the media file</strong><br>
      <span class="muted">It plays from this computer. Phones only show lights and vibrate.</span>
    </label>
    <p class="muted" id="diag" style="margin:0;font-size:.9rem">No file chosen yet.</p>
    <div class="row split">
      <button id="play">Play show</button>
      <button id="pause" class="ghost">Pause</button>
      <button id="stop" class="ghost">Stop</button>
    </div>
    <div>
      <input type="range" id="seek" min="0" max="161" step="0.01" value="0" aria-label="Position">
      <div class="muted" id="time">0:00.0</div>
    </div>
    <div>
      <label for="seg" class="muted">Preview</label>
      <select id="seg"></select>
    </div>
    <div class="row split">
      <button id="pvLaptop" class="ghost">Preview on laptop</button>
      <button id="pvPhones" class="ghost">Preview on phones</button>
    </div>
    <div>
      <label for="delay" class="muted">Light delay: <span id="delayVal">0</span> ms (raise it if the sound arrives late, e.g. Bluetooth speakers)</label>
      <input type="range" id="delay" min="-300" max="600" step="10" value="0">
    </div>
  </section>

  <section class="panel" id="join">
    <div><span class="dot" id="dot"></span><strong id="count">0 devices connected</strong></div>
    <div id="qr" aria-label="QR code to join on a phone"></div>
    <p class="muted" style="margin:0">Phones: scan the code. Computers: share this link.</p>
    <div class="linkbox">
      <input id="link" readonly aria-label="Share link">
      <button id="copy">Copy link</button>
    </div>
    <button id="share" class="ghost" hidden>Share…</button>
  </section>

  <section id="stage" aria-label="Light monitor">
    <canvas class="scene" id="hostScene"></canvas>
    <div class="light" id="hostLight"></div>
    <button id="stageFs" class="ghost">Full screen lights</button>
  </section>
</main>

<!-- DEVICE -->
<main id="guest" hidden>
  <canvas class="scene" id="guestScene"></canvas>
  <div class="light" id="guestLight"></div>
  <button id="fsBig">Go full screen</button>
  <div id="gline"><span class="dot" id="gdot"></span><span id="gstatus">Connecting…</span></div>
</main>


<script>
/* ================= ERROR REPORTER ================= */
(function(){
  function show(msg){
    let d=document.getElementById('errbox');
    if(!d){ d=document.createElement('pre'); d.id='errbox';
      d.style.cssText='position:fixed;left:0;right:0;top:0;z-index:999;margin:0;padding:10px 14px;background:#ff1744;color:#fff;font:600 13px/1.3 monospace;white-space:pre-wrap';
      document.body.appendChild(d); }
    d.textContent+=msg+'\n';
  }
  window.addEventListener('error',e=>{ if(e.message) show('Error: '+e.message+' (line '+e.lineno+')'); });
  window.addEventListener('unhandledrejection',e=>show('Error: '+(e.reason&&e.reason.message||e.reason)));
})();

/* ================= SHOW DATA ================= */
// [start, end, name, picture]  (seconds). picture: disco | yacht | money | discoball | bugatti | greek | kuchek | tarambuka | rapper | grandpa. Light starts at "start" and ignores "end"; vibration runs start→end.
const SEGMENTS = [
  [8.86, 14.54, 'lights', 'disco'],
  [14.54, 24.00, 'boat', 'yacht'],
  [24.00, 36.25, 'raining money', 'money'],
  [36.25, 48.00, 'dancing Greek girls', 'greek'],
  [48.00, 53.63, 'disco ball with lights', 'discoball'],
  [53.63, 60.16, 'Kuchek girls dancing', 'kuchek'],
  [60.16, 63.59, '', 'disco'],
  [63.59, 72.00, '', 'money'],
  [72.00, 83.20, 'tarambuka', 'tarambuka'],
  [83.20, 97.00, 'rapper', 'rapper'],
  [97.00, 120.00, '', 'money'],
  [120.00, 132.00, '', 'disco'],
  [132.00, 149.00, '', 'bugatti'],
  [149.00, 161.00, 'talking grandpa', 'grandpa']
];
// Beat times detected from the song (seconds). Lights flash on these inside vibration ranges.
const BEATS = [8.87,9.44,9.81,10.37,10.95,11.32,11.69,12.05,12.45,12.74,13.20,13.55,13.94,14.33,14.70,15.07,15.44,15.82,16.20,16.56,16.94,17.31,17.69,18.07,18.45,18.82,19.19,19.55,19.95,20.50,20.89,21.44,21.82,22.20,22.56,22.94,23.50,24.06,24.43,24.81,25.18,25.55,25.94,26.69,27.06,27.43,27.82,28.19,28.56,28.94,29.69,30.07,30.44,30.81,31.18,31.56,31.94,32.68,33.07,33.44,33.81,34.19,34.56,34.95,35.31,35.69,36.06,36.43,36.82,37.19,37.56,37.93,38.31,38.68,39.07,39.44,39.81,40.18,40.55,40.95,41.49,41.89,42.43,42.81,43.18,43.56,44.12,44.49,45.07,45.63,46.00,46.56,46.94,47.31,47.68,48.05,48.44,48.99,49.55,49.93,50.25,50.69,51.07,51.43,51.82,52.19,52.56,52.94,53.49,53.88,54.45,54.82,55.18,55.55,55.94,56.31,56.68,57.06,57.45,57.83,58.19,58.56,58.94,59.32,59.70,60.07,60.43,60.76,61.18,61.56,61.94,62.31,62.68,63.05,63.44,63.99,64.34,64.95,65.49,65.89,66.44,66.99,67.56,67.93,68.31,68.68,69.06,69.44,69.81,70.18,70.55,70.95,71.30,71.69,72.06,72.43,72.81,73.19,73.56,73.93,74.69,75.06,75.44,75.80,76.18,76.56,76.94,77.35,77.68,78.07,78.45,78.81,79.19,79.56,79.93,80.31,80.69,81.06,81.44,81.80,82.19,82.56,83.68,84.06,84.44,84.80,85.18,85.57,85.93,86.31,86.68,87.05,87.43,88.00,88.34,88.74,89.12,90.07,90.44,90.80,91.20,91.56,91.94,92.69,93.05,93.44,94.19,94.55,94.95,95.70,96.07,96.42,97.00,97.56,97.93,98.68,99.06,99.44,100.00,100.55,100.95,101.69,102.06,102.45,102.82,103.19,103.55,103.93,104.69,105.06,105.44,105.81,106.18,106.57,106.94,107.30,107.69,108.44,108.76,109.33,109.93,110.32,111.43,112.00,112.56,112.93,113.30,113.68,114.06,114.44,114.80,115.18,115.57,115.93,116.31,116.68,117.05,117.43,117.99,118.36,118.74,119.32,119.88,120.43,120.80,121.17,121.56,121.93,122.50,123.05,123.45,123.99,124.55,124.95,125.49,126.07,126.44,126.80,127.19,127.55,127.94,128.30,128.68,129.06,129.44,129.80,130.18,130.55,130.95,131.34,131.69,132.05,132.44,133.00,133.56,133.93,134.30,134.69,135.06,135.44,135.81,136.37,136.93,137.31,137.68,138.05,138.44,138.99,139.56,139.94,140.31,140.88,141.43,141.80,142.37,142.94,143.70,144.07,144.44,144.81,145.19,145.75,146.12,146.69,147.06,147.44,149.85,150.40,151.09,152.07,152.45,153.30,153.76,154.16,154.53,154.82,155.21,155.69,158.13,158.74,159.54,160.15,160.84];
const BEAT_LIGHTS = true;      // set false for lights only at segment starts
const SAME_COLORS_EVERYWHERE = true; // false = every device picks its own random colours
const COLORS = ['#ff1744','#2979ff','#ffea00','#00e676','#d500f9'];

/* ================= CUES ================= */
const CUES = [];
SEGMENTS.forEach((s,i)=>CUES.push({t:s[0],type:'start',i}));
if (BEAT_LIGHTS) BEATS.forEach(t=>{
  const i = SEGMENTS.findIndex(s=>t>s[0]+0.15 && t<s[1]-0.1);
  if (i>=0) CUES.push({t,type:'beat',i});
});
CUES.sort((a,b)=>a.t-b.t);
(function(){ // seeded colour sequence, never the same colour twice in a row
  let s=20250, prev=-1;
  const rnd=()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296};
  CUES.forEach(c=>{let k;do{k=Math.floor(rnd()*COLORS.length)}while(k===prev);prev=k;c.color=COLORS[k]});
})();
const segAt = p => SEGMENTS.findIndex(s=>p>=s[0]&&p<s[1]);

/* ================= LIGHT + VIBRATION ================= */
function flash(el,color,ms,peak=1,blend='normal'){
  if (el._a) el._a.cancel();               // overlap: cancel previous fade, start the new light
  el.style.background=color; el.style.mixBlendMode=blend;
  el._a = el.animate([{opacity:peak},{opacity:0}],{duration:ms,easing:'cubic-bezier(.15,.75,.3,1)',fill:'forwards'});
}
function clearLight(el){ if(el._a){el._a.cancel();el._a=null} }
function vibPattern(ms){const p=[];let r=ms;while(r>0){const on=Math.min(r,4000);p.push(on);r-=on;if(r>0){p.push(30);r-=30}}return p}
const canVibrate = 'vibrate' in navigator;
const vib = v => { if (canVibrate) try{navigator.vibrate(v)}catch(e){} };

function makeEngine(h){
  let last=null;
  return {
    reset(){ last=null; h.stop&&h.stop(); },
    tick(pos){
      if (last===null || Math.abs(pos-last)>0.5){ // start, seek or big correction
        last=pos; const i=segAt(pos);
        h.jump&&h.jump(pos,i); return;
      }
      if (pos<last) return;                       // small backwards drift: just wait
      for (const c of CUES){
        if (c.t>last && c.t<=pos) h.cue(c);
      }
      last=pos;
      if (last>SEGMENTS[SEGMENTS.length-1][1]) h.end&&h.end();
    }
  };
}
const fmt = s => { s=Math.max(0,s); return Math.floor(s/60)+':'+(s%60).toFixed(1).padStart(4,'0'); };

/* ================= WEB AUDIO PLAYER (no <audio> element / blob URL needed) ================= */
class WebPlayer {
  constructor(){ this._l={}; this.ctx=null; this.buf=null; this.src=null; this.off=0; this.t0=0; this.playing=false; this.duration=0; }
  addEventListener(t,f){ (this._l[t]=this._l[t]||[]).push(f); }
  emit(t){ (this._l[t]||[]).slice().forEach(f=>f({type:t})); }
  get paused(){ return !this.playing; }
  get currentTime(){
    if(!this.buf) return 0;
    if(!this.playing) return this.off;
    const lat=this.ctx.outputLatency||this.ctx.baseLatency||0;     // position actually heard
    return Math.min(this.duration, Math.max(0, this.off+(this.ctx.currentTime-this.t0)-lat));
  }
  set currentTime(v){
    v=Math.max(0,Math.min(this.duration||0,v));
    if(this.playing){ this._stop(); this.off=v; this._start(); } else this.off=v;
    this.emit('seeked');
  }
  async load(file){
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!this.ctx) this.ctx=new AC();
    this._stop(); this.playing=false; this.off=0;
    const data=file.arrayBuffer ? await file.arrayBuffer()
      : await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=()=>no(r.error);r.readAsArrayBuffer(file)});
    const raw=data.slice(0);
    this.buf=await new Promise((ok,no)=>this.ctx.decodeAudioData(data,ok,no));
    this.raw=raw; this.key=file.size+':'+(file.name||'');
    this.duration=this.buf.duration;
    this.emit('canplay');
  }
  _start(){
    const s=this.ctx.createBufferSource(); s.buffer=this.buf; s.connect(this.ctx.destination);
    s.onended=()=>{ if(this.src===s && this.playing){ this.playing=false; this.off=0; this.src=null; this.emit('ended'); } };
    this.src=s; this.t0=this.ctx.currentTime; this.playing=true;
    s.start(0,this.off);
  }
  _stop(){ if(this.src){ const s=this.src; this.src=null; s.onended=null; try{s.stop()}catch(e){} } this.playing=false; }
  async play(){
    if(!this.buf) throw Object.assign(new Error('No song loaded'),{name:'NoFile'});
    await this.ctx.resume();
    if(this.playing) return;
    if(this.off>=this.duration-0.05) this.off=0;
    this._start(); this.emit('playing');
  }
  pause(){ if(!this.playing) return; this.off=this.currentTime; this._stop(); this.emit('pause'); }
}

/* ================= SONG PLAYER ON PHONES (plays the copy received from the coordinator) ================= */
class GuestAudio{
  constructor(){ this.ctx=null; this.buf=null; this.src=null; this.off=0; this.t0=0; this.rate=1; this.key=''; }
  ensure(){ if(!this.ctx){ const AC=window.AudioContext||window.webkitAudioContext; this.ctx=new AC(); } return this.ctx; }
  unlock(){ try{ this.ensure().resume(); }catch(e){} }
  async load(ab){ this.stop(); this.buf=await new Promise((ok,no)=>this.ensure().decodeAudioData(ab,ok,no)); }
  get lat(){ return this.ctx.outputLatency||this.ctx.baseLatency||0; }
  pos(){ return this.src ? this.off+(this.ctx.currentTime-this.t0)*this.rate-this.lat : null; }   // position actually heard
  start(p){
    this.stop(); if(!this.buf||p>=this.buf.duration||this.ctx.state!=='running') return;
    const s=this.ctx.createBufferSource(); s.buffer=this.buf; s.connect(this.ctx.destination);
    s.onended=()=>{ if(this.src===s) this.src=null; };
    this.src=s; this.rate=1; this.off=Math.max(0,p+this.lat); this.t0=this.ctx.currentTime; s.start(0,this.off);
  }
  adjust(r){ if(!this.src) return; const now=this.ctx.currentTime; this.off+=(now-this.t0)*this.rate; this.t0=now; this.rate=r; this.src.playbackRate.value=r; }
  stop(){ if(this.src){ const s=this.src; this.src=null; s.onended=null; try{s.stop()}catch(e){} } }
}

/* ================= EMBEDDED WARNING ================= */
if(window.top!==window.self){
  const d=document.createElement('div');
  d.style.cssText='position:fixed;left:0;right:0;bottom:0;z-index:99;background:#ffea00;color:#000;padding:10px 14px;font:600 14px/1.3 sans-serif';
  d.innerHTML='This page is running inside another page, so full screen, audio and the file picker can be blocked. <a href="'+location.href+'" target="_blank" rel="noopener" style="color:#000">Open it in its own tab</a>';
  document.body.appendChild(d);
}

/* ================= SCENES (drawn with canvas, nothing to download) ================= */
const R=(i,k)=>{const x=Math.sin(i*127.1+k*311.7)*43758.5453;return x-Math.floor(x)};
const TAU=Math.PI*2;
let BILL=null;
function bill(){
  if(BILL) return BILL;
  const c=document.createElement('canvas'); c.width=300; c.height=128; const g=c.getContext('2d');
  g.fillStyle='#a9d493'; g.fillRect(0,0,300,128);
  g.strokeStyle='#2f5f33'; g.lineWidth=6; g.strokeRect(3,3,294,122); g.lineWidth=2; g.strokeRect(13,13,274,102);
  g.fillStyle='#c6e5b4'; g.beginPath(); g.ellipse(150,64,40,46,0,0,TAU); g.fill(); g.stroke();
  g.fillStyle='#6fa3c4'; g.beginPath(); g.arc(66,64,13,0,TAU); g.fill(); g.beginPath(); g.arc(234,64,13,0,TAU); g.fill();
  g.fillStyle='#2f5f33'; g.textAlign='center'; g.textBaseline='middle';
  g.font='bold 40px Georgia,serif'; g.fillText('100',150,66);
  g.font='bold 24px Georgia,serif'; g.fillText('100',44,36); g.fillText('100',256,94);
  g.font='bold 9px Georgia,serif'; g.fillText('THE UNITED STATES OF AMERICA',150,24); g.fillText('ONE HUNDRED DOLLARS',150,106);
  return BILL=c;
}
const rgbOf=h=>[1,3,5].map(k=>parseInt(h.substr(k,2),16));
/* ---- money: bills with depth, air flutter, tumbling and light/shade as they turn ---- */
const BN=70, BORD=[...Array(BN).keys()].sort((a,b)=>R(a,1)-R(b,1));   // far bills drawn first
function drawMoney(g,W,H,t){
  const bg=g.createRadialGradient(W/2,-H*0.1,0,W/2,H*0.3,Math.max(W,H)*0.95);
  bg.addColorStop(0,'#2a8a4c'); bg.addColorStop(.45,'#0b3519'); bg.addColorStop(1,'#020804');
  g.fillStyle=bg; g.fillRect(0,0,W,H);
  const b=bill(), base=Math.min(W,H*1.2);
  for(const i of BORD){
    const z=R(i,1), bw=base*(0.09+z*0.24), bh=bw*128/300, span=H+bh*4;
    const y=((t*H*(0.1+z*0.3)+R(i,4)*span)%span)-bh*2;               // nearer bills fall faster
    const ph=R(i,8)*TAU, sw=0.8+R(i,6)*0.9, sway=Math.sin(t*sw+ph);
    const x=R(i,2)*W+sway*bw*0.8;                                      // flutter side to side
    let s=Math.cos(t*(1.2+R(i,7)*2.4)+ph); const face=Math.abs(s); if(face<0.07) s=0.07*(s<0?-1:1);
    const a=0.3+z*0.7;

const DRAW={money:drawMoney,yacht:drawYacht,discoball:drawBall,bugatti:drawCar,greek:drawGreek,kuchek:drawKuchek,tarambuka:drawTarambuka,rapper:drawRapper,grandpa:drawGrandpa};
function makeScenes(cv){
  const g=cv.getContext('2d'); let key='', blank=false;
  const wipe=()=>{ if(blank) return; g.setTransform(1,0,0,1,0,0); g.clearRect(0,0,cv.width,cv.height); blank=true; };
  return {
    clear:wipe,
    render(pos){
      const i=pos==null?-1:segAt(pos), sc=i<0?'disco':SEGMENTS[i][3];
      if(!DRAW[sc]) return wipe();
      const w=cv.clientWidth, h=cv.clientHeight, d=Math.min(2,window.devicePixelRatio||1); if(!w||!h) return;
      if(key!==w+'x'+h+'x'+d){ key=w+'x'+h+'x'+d; cv.width=w*d; cv.height=h*d; }
      g.setTransform(cv.width/w,0,0,cv.height/h,0,0); blank=false;
      DRAW[sc](g,w,h,pos-SEGMENTS[i][0],pos);
    }
  };
}
function fire(el,c){                                     // light flash; softer overlay on top of picture scenes
  const full=SEGMENTS[c.i][3]==='disco';
  flash(el, SAME_COLORS_EVERYWHERE?c.color:COLORS[Math.random()*5|0], c.type==='start'?900:360,
        full?1:(c.type==='start'?0.55:0.3), full?'normal':'screen');
}

/* ================= COORDINATOR ================= */
function startHost(){
  $('host').hidden=false;
  const audio=new WebPlayer(), stageLight=$('hostLight');
  const conns=new Set();
  let session=null, delay=0, seeking=false;

  const hostScenes=makeScenes($('hostScene'));
  const eng = makeEngine({
    cue(c){ fire(stageLight,c); },
    stop(){ clearLight(stageLight); hostScenes.clear(); }
  });

  // scenes list
  const sel=$('seg');
  const all=document.createElement('option'); all.value='all'; all.textContent='Whole song'; sel.appendChild(all);
  SEGMENTS.forEach((s,i)=>{
    const o=document.createElement('option');
    o.value=i;o.textContent=`${fmt(s[0])} – ${fmt(s[1])}  ${s[2]||'scene '+(i+1)}`;sel.appendChild(o);
  });

  // file
  const diag=t=>{$('diag').textContent=t};
  $('file').addEventListener('change',async e=>{
    const f=e.target.files[0]; if(!f) return;
    $('fileName').textContent=f.name;
    diag('Reading '+f.name+' ('+(f.size/1048576).toFixed(1)+' MB)…');
    try{ await audio.load(f); }
    catch(err){
      diag('Could not decode this file ('+(err&&err.message||err&&err.name||'unknown error')+'). Try song-clean.mp3 or another browser.');
      $('hostStatus').textContent='This browser could not decode the file.'; return;
    }
    $('seek').max=audio.duration;
    ['play','pause','stop','pvLaptop','pvPhones'].forEach(id=>$(id).disabled=false);
    diag('Ready: '+fmt(audio.duration)+' long. Press Play show.');
    conns.forEach(c=>{ if(c.open) sendAudio(c); });
  });
  audio.addEventListener('playing',()=>diag('Playing.'));

  function begin(s,from){
    if(!audio.buf){ diag('Choose the media file first (the box at the top), then press the button again.'); $('fileLabel').style.borderColor='#ffea00'; return; }
    session=s; eng.reset();
    if(from!=null) audio.currentTime=from;
    audio.play().catch(err=>{$('hostStatus').textContent='Playback was blocked: '+err.message;diag('Play failed: '+err.name);});
  }
  function endAll(rewind){
    audio.pause(); session=null; eng.reset();
    if(rewind) audio.currentTime=0;
    sendState();
  }
  $('play').onclick=()=>begin({local:true,phones:true,stopAt:null});
  $('pause').onclick=()=>{audio.pause(); eng.reset(); sendState();};
  $('stop').onclick=()=>endAll(true);
  const previewStart=()=>sel.value==='all'?0:Math.max(0,SEGMENTS[sel.value][0]-1);
  const previewEnd=()=>sel.value==='all'?null:SEGMENTS[sel.value][1];
  $('pvLaptop').onclick=()=>begin({local:true,phones:false,stopAt:previewEnd()},previewStart());
  $('pvPhones').onclick=()=>begin({local:false,phones:true,stopAt:previewEnd()},previewStart());
  $('seek').addEventListener('input',e=>{seeking=true;audio.currentTime=+e.target.value;eng.reset();$('time').textContent=fmt(+e.target.value)});
  $('seek').addEventListener('change',()=>{seeking=false;sendState()});
  $('delay').addEventListener('input',e=>{delay=+e.target.value;$('delayVal').textContent=delay;sendState()});
  audio.addEventListener('ended',()=>endAll(true));
  ['playing','pause','seeked'].forEach(ev=>audio.addEventListener(ev,sendState));

  function sendState(){
    const m={t:'state',playing:!!(session&&session.phones&&!audio.paused),pos:audio.currentTime,at:Date.now(),delay};
    conns.forEach(c=>c.open&&c.send(m));
  }
  setInterval(()=>{ if(session&&!audio.paused) sendState(); },2000);

  (function loop(){
    if(session&&!audio.paused){
      const pos=audio.currentTime;
      if(session.local){ eng.tick(pos-delay/1000); hostScenes.render(pos-delay/1000); }
      if(session.stopAt!=null && pos>=session.stopAt) endAll(false);
    }
    if(!seeking){$('seek').value=audio.currentTime;$('time').textContent=fmt(audio.currentTime)+' / '+fmt(audio.duration||0)}
    requestAnimationFrame(loop);
  })();


  // full screen (whole page, or just the light monitor)
  const fsNow=()=>document.fullscreenElement||document.webkitFullscreenElement;
  async function fsToggle(el){
    if(fsNow()){ (document.exitFullscreen||document.webkitExitFullscreen).call(document); return; }
    const f=el.requestFullscreen||el.webkitRequestFullscreen;
    if(!f||(document.fullscreenEnabled===false)){ diag('Full screen is blocked here. Open this page in its own browser tab (not inside a preview).'); return; }
    try{ await f.call(el); }catch(err){ diag('Full screen was refused: '+(err&&err.message||err)); }
  }
  $('hostFs').onclick=()=>fsToggle(document.documentElement);
  $('stageFs').onclick=()=>fsToggle($('stage'));
  function fsLabels(){
    const c=fsNow();
    $('hostFs').textContent=c===document.documentElement?'Exit full screen':'Go full screen';
    $('stageFs').textContent=c===$('stage')?'Exit full screen':'Full screen lights';
  }
  ['fullscreenchange','webkitfullscreenchange'].forEach(ev=>document.addEventListener(ev,fsLabels));
  document.addEventListener('keydown',e=>{            // Space = play/pause while the lights fill the screen
    if(e.code==='Space' && fsNow()===$('stage') && audio.buf){ e.preventDefault(); (audio.paused?$('play'):$('pause')).click(); }
  });

  // Link + QR come first (they only need the room id); PeerJS connects afterwards
  let hid; try{hid=localStorage.getItem('lightshow-host')}catch(e){}
  const newId=()=>'lightshow-'+Math.random().toString(36).slice(2,8);
  hid=hid||newId();
  const urlFor=pid=>location.origin==='null'||location.protocol==='file:'
    ? location.href.split('?')[0]+'?join='+encodeURIComponent(pid)
    : location.origin+location.pathname+'?join='+encodeURIComponent(pid);
  function showLink(){
    try{localStorage.setItem('lightshow-host',hid)}catch(e){}
    const url=urlFor(hid);
    $('link').value=url; $('qr').innerHTML='';
    if(typeof QRCode!=='undefined'){ try{ new QRCode($('qr'),{text:url,width:176,height:176}); }catch(e){} }
    else $('qr').innerHTML='<span style="color:#000;font:.8rem/1.3 sans-serif;display:block;width:156px">QR code is loading… or blocked. Use the link instead.</span>';
  }
  $('copy').onclick=async()=>{ const url=$('link').value;
    try{await navigator.clipboard.writeText(url)}catch(e){$('link').select();document.execCommand('copy')}
    $('copy').textContent='Copied';setTimeout(()=>$('copy').textContent='Copy link',1500)};
  if(navigator.share){ $('share').hidden=false; $('share').onclick=()=>navigator.share({title:'Join the light show',url:$('link').value}).catch(()=>{}); }
  showLink();
  const local=!/^https?:$/.test(location.protocol)||/^(localhost|127\.|192\.168\.|10\.)/.test(location.hostname);
  if(local) $('hostStatus').textContent='Note: this page is not on a public address, so phones can’t open the link. Open it from your GitHub Pages address.';

  // load a library, trying backup sources if the first one failed
  const lib=async(test,urls)=>{
    for(const u of urls){ if(test()) break;
      await new Promise(r=>{const s=document.createElement('script');s.src=u;s.onload=s.onerror=r;document.head.appendChild(s)}); }
    return test();
  };
  function openPeer(){
    const peer=new Peer(hid);
    peer.on('open',()=>{ if(!local) $('hostStatus').textContent='Ready. Pick a file, then let devices join.'; });
    peer.on('connection',c=>{
      c.on('open',()=>{conns.add(c);upd();sendState()});
      c.on('data',m=>{ if(m.t==='ping') c.send({t:'pong',c:m.c,s:Date.now()}); if(m.t==='hello'){ c._have=m.have; sendAudio(c); } });
      c.on('close',()=>{conns.delete(c);upd()});
      c.on('error',()=>{conns.delete(c);upd()});
    });
    peer.on('error',e=>{
      if(e.type==='unavailable-id'){ hid=newId(); showLink(); openPeer(); return; }
      $('hostStatus').textContent='Could not reach the PeerJS server ('+e.type+'). The link works, but devices can’t join until this is fixed.';
    });
    peer.on('disconnected',()=>{ try{peer.reconnect()}catch(e){} });
  }
  // send the song file to a device, in small pieces (skipped if that device already has it)
  let sendId=0;
  async function sendAudio(c){
    if(!audio.raw||c._have===audio.key) return;
    const id=++sendId, raw=audio.raw, N=16384, n=Math.ceil(raw.byteLength/N); c._aid=id;
    c.send({t:'audio-start',id,key:audio.key,size:raw.byteLength,n});
    for(let i=0;i<n;i++){
      if(!c.open||c._aid!==id) return;
      while(c.dataChannel&&c.dataChannel.bufferedAmount>1048576) await new Promise(r=>setTimeout(r,30));
      c.send({t:'audio-chunk',id,i,d:raw.slice(i*N,(i+1)*N)});
      if(i%32===31) await new Promise(r=>setTimeout(r,0));
    }
    c._have=audio.key;
  }
  function upd(){
    $('count').textContent=conns.size+(conns.size===1?' device connected':' devices connected');
    $('dot').classList.toggle('on',conns.size>0);
  }
  if(!local) $('hostStatus').textContent='Starting…';
  Promise.all([
    lib(()=>typeof QRCode!=='undefined',['https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js']).then(ok=>{ if(ok) showLink(); }),
    lib(()=>typeof Peer!=='undefined',['https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js']).then(ok=>{
      if(ok) openPeer(); else $('hostStatus').textContent='Could not load PeerJS. Check the internet connection. The link is shown, but devices can’t join yet.'; })
  ]);
}

/* ================= DEVICE (phone or computer) ================= */
function startGuest(hostId){
  const g=$('guest'); g.hidden=false; document.body.style.overflow='hidden';
  const L=$('guestLight');
  let offset=0, best=1e9, base=null, conn=null, connected=false, problem=false, started=false, rx=null;
  const ga=new GuestAudio();
  const guestScenes=makeScenes($('guestScene'));
  const eng=makeEngine({
    cue(c){ fire(L,c);
            if(c.type==='start') vib(vibPattern((SEGMENTS[c.i][1]-SEGMENTS[c.i][0])*1000)); },
    jump(p,i){ if(i>=0) vib(vibPattern((SEGMENTS[i][1]-p)*1000)); },   // joined or seeked mid-scene
    stop(){ clearLight(L); guestScenes.clear(); vib(0); },
    end(){ vib(0); }
  });
  const status=(t,on)=>{$('gstatus').textContent=t;$('gdot').classList.toggle('on',!!on)};

  // the only control: full screen (this tap also unlocks sound and vibration)
  const docEl=document.documentElement;
  const canFS=!!(docEl.requestFullscreen||docEl.webkitRequestFullscreen);
  const isFS=()=>!!(document.fullscreenElement||document.webkitFullscreenElement);
  const ui=()=>g.classList.toggle('calm',(isFS()||(!canFS&&started))&&connected&&!problem);
  ['fullscreenchange','webkitfullscreenchange'].forEach(ev=>document.addEventListener(ev,ui));
  if(!canFS) $('fsBig').textContent='Tap to start';   // iPhone Safari has no full screen mode
  $('fsBig').onclick=async()=>{
    started=true; ga.unlock(); vib(40);
    if(canFS){ try{ await (docEl.requestFullscreen||docEl.webkitRequestFullscreen).call(docEl); }
      catch(e){ status('Full screen is blocked here. Open this page in its own browser tab.',connected); } }
    try{ await navigator.wakeLock.request('screen'); }catch(e){}
    ui();
  };

  const rawNow=()=> base&&base.playing ? base.pos+(Date.now()+offset-base.at)/1000 : null;   // song position on the coordinator
  const posNow=()=>{ const r=rawNow(); return r===null?null:r-base.delay/1000; };              // lights use the delay setting
  (function loop(){ const p=posNow(); if(p!==null){ eng.tick(p); guestScenes.render(p); } else guestScenes.clear(); requestAnimationFrame(loop) })();

  // keep this device's copy of the song in step with the coordinator
  setInterval(()=>{
    if(!ga.buf) return;
    const r=rawNow(); if(r===null){ ga.stop(); return; }
    const p=ga.pos();
    if(p===null||Math.abs(p-r)>.3) ga.start(r);
    else ga.adjust(1-Math.max(-.03,Math.min(.03,(p-r)*.5)));
  },250);

  function connect(){
    status('Connecting…');
    if(typeof Peer==='undefined'){ status('Could not load PeerJS. Check the internet connection.'); return; }
    const peer=new Peer();
    peer.on('open',()=>{
      conn=peer.connect(hostId,{reliable:true});
      conn.on('open',()=>{connected=true;status('Connected',true);ui();burst();conn.send({t:'hello',have:ga.key||''});});
      conn.on('data',m=>{
        if(m.t==='pong'){ const rtt=Date.now()-m.c; if(rtt<best){best=rtt;offset=m.s+rtt/2-Date.now()} }
        if(m.t==='state'){ const wasPlaying=base&&base.playing; base=m;
          if(!m.playing) eng.reset(); else if(!wasPlaying) eng.reset(); }
        if(m.t==='audio-start'){ rx={id:m.id,size:m.size,key:m.key,parts:[],bytes:0}; problem=false; status('Loading song 0%',true); ui(); }
        if(m.t==='audio-chunk'&&rx&&rx.id===m.id){
          const d=m.d, u=d instanceof ArrayBuffer?new Uint8Array(d):new Uint8Array(d.buffer,d.byteOffset,d.byteLength);
          rx.parts.push(u); rx.bytes+=u.byteLength; status('Loading song '+Math.floor(rx.bytes/rx.size*100)+'%',true);
          if(rx.bytes>=rx.size){
            const all=new Uint8Array(rx.size); let o=0; rx.parts.forEach(q=>{all.set(q,o);o+=q.byteLength}); const key=rx.key; rx=null;
            ga.load(all.buffer).then(()=>{ga.key=key;status('Connected',true);ui();})
              .catch(()=>{problem=true;status('This device could not decode the song.');ui();});
          }
        }
      });
      conn.on('close',()=>{connected=false;ui();status('Disconnected, retrying…');eng.reset();ga.stop();setTimeout(()=>{peer.destroy();connect()},2000)});
      conn.on('error',()=>{});
    });
    peer.on('error',e=>{connected=false;ui();status('Can’t reach the coordinator ('+e.type+'), retrying…');setTimeout(()=>{peer.destroy();connect()},3000)});
  }
  function burst(){ best=1e9; let n=0; const t=setInterval(()=>{ if(conn&&conn.open) conn.send({t:'ping',c:Date.now()}); if(++n>=10)clearInterval(t)},150); }
  setInterval(()=>{ if(conn&&conn.open) burst() },15000);   // keep the clock offset fresh
  connect();
}
</script>
</body>
